<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeating Text</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: gray;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .container {
            max-width: 400px;
            max-height: 300px;
            padding: 15px;
            background-color: rgb(11, 11, 202);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            flex-direction: column;
            gap: 20px;
            border-radius: 10px;
            box-shadow: -1px 0 9px 9px rgb(255, 247, 247);

        }

        h1 {
            text-align: center;
            color: greenyellow;
            font-weight: bold;
            font-size: 30px;
            font-family: Arial, sans-serif;

        }

        .w {
            width: 200px;
            height: 50px;
            border-radius: 10px;
            border: none;
            text-align: center;
        }

        .input {
            width: 200px;
            height: 50px;
            border-radius: 10px;
            border: none;
            text-align: center;
        }

        .btn {
            width: 100px;
            height: 50px;
            border-radius: 10px;
            border: none;
            text-align: center;
        }

        #text {
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .x {
            display: none;
            background-color: #fff;
            width: 300px;
            border-radius: 10px;
            border: none;
            text-align: center;
            overflow: hidden;
            scroll-behavior: smooth;
        }
    </style>
</head>

<body>

    <div>
        <div class="container">
            <h1>Repeating Text</h1>
            <input class="w" type="text" placeholder="What do U Want ?">
            <input class="input" type="text" placeholder="How Many Times">
            <button class="btn">click me!</button>
        </div>
        <div class="x">
            <h1>OUTPUT</h1>
            <hr>
            <p id="text"></p>
        </div>
    </div>
    <script>
        const input = document.querySelector(".input");
        const w = document.querySelector(".w");
        const btn = document.querySelector(".btn");
        const text = document.querySelector("#text");

        btn.addEventListener("click", function () {
            if (Number(input.value) >= 500 || w.value.length >= 20) {
                alert('Please Enter Valid Number\n Choice Should be >=500 \n Text >= 25')
            } else {
                for (let i = 1; i <= Number(input.value); i++) {
                    document.querySelector(".container").style.display = "none"
                    document.querySelector(".x").style.display = "block"
                    text.innerHTML += `${w.value} <br>`;

                }
            }

        })

    </script>

</body>

</html>
